# maestro/flows/carousel-video-playback.yaml
#
# E08a: 轮播模式视频播放+静音验证
# 轮播模式 → 视频浏览 → 点击播放 → 验证静音按钮
#
appId: com.cleanpic.android
---
- launchApp
# 关闭可能出现的「发现新版本」弹窗（测试设备版本可能落后于线上已发布版，不影响被测功能）
- tapOn:
    id: "update_later_button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 10000
- waitForAnimationToEnd

# 确保轮播模式
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "轮播相册"
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

# 切到「视频」Tab（首页默认照片 Tab，start_video 仅在视频 Tab 下出现）
- tapOn: "视频"
- waitForAnimationToEnd
# 进入视频浏览
- tapOn:
    id: "start_video"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "start_video"
    optional: true
- waitForAnimationToEnd

# 截图：视频缩略图 + 播放图标应可见
- takeScreenshot: maestro/screenshots/carousel-video-thumbnail

# 点击播放图标
- tapOn:
    id: "play_button"
- waitForAnimationToEnd

# 等待视频加载播放
- swipe:
    start: "50%, 50%"
    end: "50%, 50%"
    duration: 1500

# 验证静音按钮可见
- assertVisible:
    id: "mute_button"
- takeScreenshot: maestro/screenshots/carousel-video-playing

# 点击静音按钮切换声音
- tapOn:
    id: "mute_button"
- waitForAnimationToEnd
- assertVisible:
    id: "mute_button"
- takeScreenshot: maestro/screenshots/carousel-video-unmuted

# 退出
- tapOn:
    id: "exit_button"
- waitForAnimationToEnd
