# maestro/flows/video-thumbnail.yaml
#
# E13: 视频缩略图展示验证（轮播模式）
# 进入视频浏览 → 截图验证视频缩略图和时长角标
#
appId: com.cleanpic.android
---
- launchApp
# 关闭可能出现的「发现新版本」弹窗（测试设备版本可能落后于线上已发布版，不影响被测功能）
- tapOn:
    id: "update_later_button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 10000
- waitForAnimationToEnd

# 确保轮播模式
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "轮播相册"
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

# 切到「视频」Tab（首页默认照片 Tab，start_video 仅在视频 Tab 下出现）
- tapOn:
    text: "视频"
    optional: true
- waitForAnimationToEnd
# 进入视频浏览
- tapOn:
    id: "start_video"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "start_video"
    optional: true
- waitForAnimationToEnd

# 等待进入 viewer
- assertVisible:
    text: ".*\\d+ / \\d+.*"

# 截图：视频缩略图（应显示视频首帧，而非 emoji）
- takeScreenshot: maestro/screenshots/video-thumbnail-carousel
