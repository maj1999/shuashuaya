# maestro/flows/direct/result-cumulative.yaml
#
# E2E: 结果页成果统一卡（US-CP-28）
# 全保留走完一轮 → 结果页完成态 → 验证「本轮清理」主角 + 「累计已清理」注脚可见
# （本轮量为放大主角，累计降为下方小字注脚；不再单列「已释放」）
# 对应: feat/cleanup-stats 阶段一·结果页升级
#
appId: com.cleanpic.android
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 30000
- waitForAnimationToEnd

# 确保轮播模式 + 轮次 5
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "轮播相册"
- waitForAnimationToEnd
- tapOn: "5"
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

# 进入照片浏览
- tapOn:
    id: "start_photo"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "start_photo"
    optional: true
- waitForAnimationToEnd

# 全保留 5 张 → 到达结果页完成态（无待删除项）
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "keep_button"
      - waitForAnimationToEnd

# 验证成果统一卡：主角「本轮清理」+ 注脚「累计已清理 X」（完成态独有；位于结果页下方，滚动揭示）
# 注：注脚现为单个文本「累计已清理 <大小>」，故用正则部分匹配。
- assertVisible: ".*本轮清理.*"
- scrollUntilVisible:
    element:
      text: ".*累计已清理.*"
    direction: DOWN
- assertVisible: ".*累计已清理.*"
- takeScreenshot: maestro/screenshots/result-cumulative
