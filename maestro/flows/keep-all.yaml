# maestro/flows/keep-all.yaml
#
# E03: 全部保留 → 结果页无确认删除按钮
#
appId: com.cleanpic.android
---
- launchApp
- waitForAnimationToEnd

# 确保轮播模式
- tapOn: "⚙️"
- waitForAnimationToEnd
- tapOn: "轮播"
- waitForAnimationToEnd
- tapOn: "←"
- waitForAnimationToEnd

# 进入照片浏览
- tapOn: ".*随机清理照片"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*随机清理照片"
    optional: true
- waitForAnimationToEnd

# 全部保留（连续点 10 次 ✓）
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd
- tapOn: "✓"
- waitForAnimationToEnd

# 验证结果页：删除 0，保留 10
- assertVisible: "保留"
- assertVisible: "释放"
- assertVisible: ".*再来一轮"
- takeScreenshot: keep-all-result
