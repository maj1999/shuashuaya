# maestro/flows/video-cleanup.yaml
#
# E07: 视频清理流程（轮播模式）
#
appId: com.cleanpic.android
---
- launchApp
- waitForAnimationToEnd

# 确保轮播模式
- tapOn: "⚙️"
- waitForAnimationToEnd
- tapOn: "轮播"
- waitForAnimationToEnd
- tapOn: "←"
- waitForAnimationToEnd

# 进入视频浏览
- tapOn: ".*随机清理视频"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*随机清理视频"
    optional: true
- waitForAnimationToEnd

# 截图验证（可能进入 viewer 或空状态）
- takeScreenshot: video-cleanup-viewer

# 如果有视频，操作（2 个视频，全部保留）
- tapOn:
    text: "✓"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "✓"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: video-cleanup-result
