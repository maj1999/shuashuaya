# maestro/flows/delete-confirm.yaml
#
# E04: 全部删除 → 结果页确认删除（轮播模式）
# 设置轮播模式 → viewer → 全部标记删除 → 结果页 → 确认删除
#
appId: com.cleanpic.android
---
- launchApp
- waitForAnimationToEnd

# 进入设置，确保轮播模式
- tapOn: "⚙️"
- waitForAnimationToEnd
- tapOn: "轮播"
- waitForAnimationToEnd
- tapOn: "←"
- waitForAnimationToEnd

# 进入照片浏览
- tapOn: ".*随机清理照片"
- waitForAnimationToEnd

# 处理权限
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*随机清理照片"
    optional: true
- waitForAnimationToEnd

# 全部标记删除（连续点 10 次 🗑️）
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd
- tapOn: "🗑️"
- waitForAnimationToEnd

# 验证结果页显示删除统计
- assertVisible: "删除"
- assertVisible: "保留"
- takeScreenshot: delete-confirm-result

# 点击确认删除按钮
- tapOn:
    text: ".*确认删除.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: delete-confirm-after
