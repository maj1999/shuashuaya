# maestro/flows/video-cleanup.yaml
#
# E07: 视频清理流程（轮播模式）
#
appId: com.cleanpic.android
---
- launchApp
# 关闭可能出现的「发现新版本」弹窗（测试设备版本可能落后于线上已发布版，不影响被测功能）
- tapOn:
    id: "update_later_button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 10000
- waitForAnimationToEnd

# 确保轮播模式
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "轮播相册"
- waitForAnimationToEnd
- tapOn: "5"
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

# 切到「视频」Tab（首页默认照片 Tab，start_video 仅在视频 Tab 下出现）
- tapOn:
    text: "视频"
    optional: true
- waitForAnimationToEnd
# 进入视频浏览
- tapOn:
    id: "start_video"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "start_video"
    optional: true
- waitForAnimationToEnd

# 截图验证（可能进入 viewer 或空状态）
- takeScreenshot: maestro/screenshots/video-cleanup-viewer

# 全部保留（roundCount=5，逐个点保留，optional 容错实际视频数量）
- repeat:
    times: 6
    commands:
      - tapOn:
          id: "keep_button"
          optional: true
      - waitForAnimationToEnd

# 全保留无待删除 → 结果页直接进入完成态
- extendedWaitUntil:
    visible: ".*本轮清理完成.*"
    timeout: 10000
- takeScreenshot: maestro/screenshots/video-cleanup-result
