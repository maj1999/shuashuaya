# maestro/flows/delete-confirm.yaml
#
# E2E: 首页 → 点击照片按钮 → 处理权限弹窗 → 验证进入浏览或空状态
#
appId: com.cleanpic.android
---
- launchApp
- waitForAnimationToEnd
- tapOn: ".*随机清理照片"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: delete-confirm-after-permission
