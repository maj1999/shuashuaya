# maestro/flows/store/video/swipecard-video-playback.yaml
#
# E08b: 卡片模式视频播放+静音验证（store 渠道）
# 卡片模式 → 视频浏览 → 点击播放 → 验证静音按钮
#
appId: com.cleanpic.android
---
- stopApp
- launchApp
# store 包无自动更新，不会弹「发现新版本」；保留 optional 容错与 direct 版对齐
- tapOn:
    id: "update_later_button"
    optional: true
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 30000
- waitForAnimationToEnd

# 切换到卡片模式
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "卡片左右"
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

# 切到「视频」Tab（首页默认照片 Tab，start_video 仅在视频 Tab 下出现）
- tapOn:
    text: "视频"
    optional: true
- waitForAnimationToEnd
# 进入视频浏览
- tapOn:
    id: "start_video"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "start_video"
    optional: true
- waitForAnimationToEnd

# 截图：视频缩略图 + 播放图标应可见
- takeScreenshot: maestro/screenshots/swipecard-video-thumbnail

# 点击播放图标（卡片内联播放，不进全屏）
- tapOn:
    id: "play_button"
- waitForAnimationToEnd

# 等待视频加载播放 —— 等静音按钮出现即可，不可用原地 swipe，
# 否则会被卡片的点击手势识别为「点击进全屏」(US-CP-18)，污染本流的卡片内联播放验证
- extendedWaitUntil:
    visible:
      id: "mute_button"
    timeout: 5000

# 验证静音按钮可见
- assertVisible:
    id: "mute_button"
- takeScreenshot: maestro/screenshots/swipecard-video-playing

# 点击静音按钮切换声音
- tapOn:
    id: "mute_button"
- waitForAnimationToEnd
- assertVisible:
    id: "mute_button"
- takeScreenshot: maestro/screenshots/swipecard-video-unmuted

# 退出并恢复轮播模式
- tapOn:
    id: "exit_button"
- waitForAnimationToEnd
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "轮播相册"
- waitForAnimationToEnd
