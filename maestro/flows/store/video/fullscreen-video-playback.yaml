# maestro/flows/fullscreen-video-playback.yaml
#
# E14: 全屏模式视频播放 + 切换验证
# 切换到全屏模式 → 进入视频浏览 → 验证视频播放 → 切换下一个视频 → 验证视频切换成功
#
appId: com.cleanpic.android
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 10000
- waitForAnimationToEnd

# 切换到全屏模式
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "全屏上下"
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

# 进入视频浏览
- tapOn:
    id: "start_video"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "start_video"
    optional: true
- waitForAnimationToEnd

# 等待第一个视频加载和播放
- assertVisible:
    id: "exit_button"

# 截图：第一个视频播放中
- takeScreenshot: maestro/screenshots/fullscreen-video-playing

# 验证顶部栏计数显示 "1 / N"
- assertVisible:
    id: "exit_button"

# 等待 2 秒让视频播放一段
- swipe:
    start: "50%, 50%"
    end: "50%, 50%"
    duration: 2000

# 再次截图验证第一个视频在播放
- takeScreenshot: maestro/screenshots/fullscreen-video-playing-2

# === 切换到第二个视频（点击保留按钮） ===
- tapOn:
    id: "keep_button"
- waitForAnimationToEnd

# 等待第二个视频加载
- swipe:
    start: "50%, 50%"
    end: "50%, 50%"
    duration: 2000

# 截图：第二个视频应显示不同内容（验证视频切换成功）
- takeScreenshot: maestro/screenshots/fullscreen-video-switch-1

# === 再切换一个视频（点击删除按钮） ===
- tapOn:
    id: "delete_button"
- waitForAnimationToEnd

# 等待第三个视频加载
- swipe:
    start: "50%, 50%"
    end: "50%, 50%"
    duration: 2000

# 截图：第三个视频画面
- takeScreenshot: maestro/screenshots/fullscreen-video-switch-2

# 验证顶部栏和退出按钮仍可见（UI 正常）
- assertVisible:
    id: "exit_button"

# 恢复轮播模式
- tapOn:
    id: "exit_button"
- waitForAnimationToEnd
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "轮播相册"
- waitForAnimationToEnd
