# maestro/flows/photo-thumbnail.yaml
#
# E12: 照片缩略图展示验证（轮播模式）
# 进入照片浏览 → 截图验证缩略图已加载（非 emoji 占位符）→ 切换多张验证
#
appId: com.cleanpic.android
---
- launchApp
- waitForAnimationToEnd

# 确保轮播模式
- tapOn:
    id: "settings_button"
- waitForAnimationToEnd
- tapOn: "轮播"
- waitForAnimationToEnd
- tapOn:
    id: "back_button"
- waitForAnimationToEnd

# 进入照片浏览
- tapOn: ".*随机清理照片"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*随机清理照片"
    optional: true
- waitForAnimationToEnd

# 等待进入 viewer
- assertVisible:
    text: ".*\\d+ / \\d+.*"

# 截图：第 1 张照片缩略图
- takeScreenshot: photo-thumbnail-1

# 保留并切到下一张
- tapOn:
    id: "keep_button"
- waitForAnimationToEnd

# 截图：第 2 张照片缩略图
- takeScreenshot: photo-thumbnail-2

# 再切一张
- tapOn:
    id: "keep_button"
- waitForAnimationToEnd

# 截图：第 3 张照片缩略图
- takeScreenshot: photo-thumbnail-3
