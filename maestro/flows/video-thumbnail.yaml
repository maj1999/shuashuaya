# maestro/flows/video-thumbnail.yaml
#
# E13: 视频缩略图展示验证（轮播模式）
# 进入视频浏览 → 截图验证视频缩略图和时长角标
#
appId: com.cleanpic.android
---
- launchApp
- waitForAnimationToEnd

# 确保轮播模式
- tapOn: "⚙️"
- waitForAnimationToEnd
- tapOn: "轮播"
- waitForAnimationToEnd
- tapOn: "←"
- waitForAnimationToEnd

# 进入视频浏览
- tapOn: ".*随机清理视频"
- waitForAnimationToEnd
- tapOn:
    text: "授权"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Allow"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*随机清理视频"
    optional: true
- waitForAnimationToEnd

# 等待进入 viewer
- assertVisible:
    text: ".*\\d+ / \\d+.*"

# 截图：视频缩略图（应显示视频首帧，而非 emoji）
- takeScreenshot: video-thumbnail-carousel
