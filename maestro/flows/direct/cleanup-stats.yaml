# maestro/flows/direct/cleanup-stats.yaml
#
# E2E: 清理成果页验证
# 从首页点击统计入口，验证 StatsScreen 各区块文案可见
# 对应: feat/cleanup-stats
#
appId: com.cleanpic.android
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "stats_button"
    timeout: 30000
- waitForAnimationToEnd

# 点击清理成果入口
- tapOn:
    id: "stats_button"
- waitForAnimationToEnd

# 验证清理成果页各区块文案（页面更长，下方区块逐段滚动揭示）
- assertVisible: "清理成果"
- assertVisible: "累计已清理"
- takeScreenshot: maestro/screenshots/cleanup-stats
- scrollUntilVisible:
    element:
      text: "里程碑"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "分类构成"
    direction: DOWN
- assertVisible: "总计"
# 月度回顾仅在有清理明细时出现，存在即校验（容错）
- assertVisible:
    text: "月度回顾"
    optional: true
- scrollUntilVisible:
    element:
      text: "设备存储"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "全程离线 · 清理记录仅存本机，不上传"
    direction: DOWN

# 标题栏吸顶守门：滚动到页面底部后，「清理成果」标题仍固定可见（不随内容滚走）
- assertVisible: "清理成果"
